name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          package_tag="v$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${package_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_tag}."
            exit 1
          fi
          echo "tag=${package_tag}" >> "${GITHUB_OUTPUT}"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${RELEASE_TAG} already exists; nothing to publish."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run complete release gate
        if: steps.existing.outputs.exists != 'true'
        run: npm run check

      - name: Create checksummed release assets
        if: steps.existing.outputs.exists != 'true'
        run: npm run package:release

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" release/* \
            --target "${GITHUB_SHA}" \
            --title "SillCast ${RELEASE_TAG}" \
            --generate-notes
